<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Proton Ajuda - Central de Ajuda</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação oficial e central de ajuda do Proton - Prontuário Inteligente">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" href="_design/logo.png" type="image/png">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* =========================================
       DESIGN SYSTEM - TEMA CLARO (LIGHT)
       ========================================= */
    :root {
      --theme-color: #174b88;
      --theme-color-secondary: #2167b0;
      --accent-color: #1D9E75;
      --accent-light: #8dcdbd;
      --bg-color: #f8fafc;
      --sidebar-bg: #ffffff;
      --header-bg: #ffffff;
      --text-color: #334155;
      --text-heading: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --callout-bg: #f0fdf4;
      --callout-border: #1D9E75;
      --callout-text: #166534;
      --search-bg: #f1f5f9;
      --search-border: #cbd5e1;
      --search-text: #0f172a;
      --code-bg: #f1f5f9;
      --code-text: #0f172a;
      --step-badge-bg: #174b88;
      --step-badge-text: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* =========================================
       DESIGN SYSTEM - TEMA ESCURO (DARK UX PRO)
       ========================================= */
    html.dark, body.dark {
      --theme-color: #3b82f6;
      --theme-color-secondary: #60a5fa;
      --accent-color: #2dd4bf;
      --accent-light: #5eead4;
      --bg-color: #0b0f17;
      --sidebar-bg: #131b2e;
      --header-bg: #131b2e;
      --text-color: #f1f5f9;
      --text-heading: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #222f49;
      --callout-bg: rgba(45, 212, 191, 0.08);
      --callout-border: #2dd4bf;
      --callout-text: #f0fdf4;
      --search-bg: #0b0f17;
      --search-border: #2e3f5f;
      --search-text: #ffffff;
      --code-bg: #1a243b;
      --code-text: #38bdf8;
      --step-badge-bg: #2563eb;
      --step-badge-text: #ffffff;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    /* Base Reset */
    * {
      box-sizing: border-box;
    }

    html, body {
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* =========================================
       CABEÇALHO FIXO (HEADER)
       ========================================= */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      transition: background-color 0.25s ease, border-color 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-heading) !important;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted) !important;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Botão Alternador de Tema */
    .theme-toggle-btn {
      background-color: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 9999px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-heading);
      transition: all 0.2s ease;
      font-size: 1.15rem;
    }

    .theme-toggle-btn:hover {
      background-color: var(--sidebar-bg);
      border-color: var(--theme-color);
      transform: scale(1.05);
    }

    /* =========================================
       BUSCA NO CABEÇALHO (SEARCH)
       ========================================= */
    .search {
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }

    .search input {
      background-color: var(--search-bg) !important;
      border: 1px solid var(--search-border) !important;
      border-radius: 9999px !important;
      padding: 8px 16px 8px 38px !important;
      font-size: 0.9rem !important;
      color: var(--search-text) !important;
      width: 230px !important;
      transition: all 0.2s ease !important;
    }

    .search input::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.9;
    }

    .search input:focus {
      width: 300px !important;
      border-color: var(--accent-color) !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.2) !important;
    }

    .search .input-wrap {
      position: relative;
    }

    .search .input-wrap::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Painel de Resultados da Busca */
    .search .results-panel {
      position: absolute !important;
      top: 52px !important;
      right: 0 !important;
      width: 380px !important;
      max-height: 480px !important;
      background-color: var(--sidebar-bg) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 12px !important;
      box-shadow: var(--shadow-md) !important;
      padding: 12px !important;
      overflow-y: auto !important;
      z-index: 1000 !important;
    }

    .search .matching-post {
      border-bottom: 1px solid var(--border-color) !important;
      padding: 10px !important;
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    .search .matching-post:hover {
      background-color: var(--search-bg) !important;
    }

    .search .matching-post h2 {
      font-size: 1rem !important;
      color: var(--text-heading) !important;
      margin: 0 0 4px 0 !important;
      border: none !important;
      padding: 0 !important;
    }

    .search .matching-post p {
      font-size: 0.85rem !important;
      color: #475569 !important;
      margin: 0 !important;
      line-height: 1.5 !important;
    }

    html.dark .search .matching-post p,
    body.dark .search .matching-post p {
      color: #cbd5e1 !important;
    }

    .search em {
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      font-weight: 700 !important;
      padding: 1px 4px !important;
      border-radius: 4px !important;
      font-style: normal !important;
    }

    html.dark .search em,
    body.dark .search em {
      background-color: #273549 !important;
      color: #ffffff !important;
      border: 1px solid #3e5272 !important;
    }

    /* =========================================
       BARRA LATERAL (SIDEBAR)
       ========================================= */
    .sidebar {
      top: 64px !important;
      height: calc(100vh - 64px) !important;
      background-color: var(--sidebar-bg) !important;
      border-right: 1px solid var(--border-color) !important;
      padding: 24px 14px !important;
      box-sizing: border-box;
      width: 280px !important;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .sidebar-nav strong {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted) !important;
      margin-top: 22px;
      margin-bottom: 8px;
      display: block;
      padding-left: 12px;
      font-weight: 700;
    }

    .sidebar-nav ul {
      padding-left: 0 !important;
      margin: 0 !important;
      list-style: none !important;
    }

    .sidebar-nav > ul > li {
      margin: 4px 0 !important;
    }

    .sidebar-nav li a {
      color: var(--text-color) !important;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 8px 14px !important;
      border-radius: 8px;
      display: block;
      text-decoration: none !important;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }

    .sidebar-nav li a:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-heading) !important;
    }

    /* Item Ativo da Sidebar (Destaque Verde-Menta) */
    .sidebar-nav li.active > a,
    .sidebar-nav li > a.active {
      color: var(--text-heading) !important;
      font-weight: 700 !important;
      border-left: 3px solid var(--accent-color) !important;
      background-color: rgba(45, 212, 191, 0.12) !important;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    /* =========================================
       ÁREA DE CONTEÚDO (MAIN CONTENT)
       ========================================= */
    .content {
      padding-top: 80px !important;
      left: 280px !important;
      max-width: 960px;
    }

    .markdown-section {
      max-width: 820px !important;
      padding: 30px 40px !important;
      color: var(--text-color) !important;
    }

    /* TÍTULOS COM CONTRASTE MÁXIMO (BRANCO NO MODO ESCURO) */
    .markdown-section h1,
    h1 {
      font-size: 2rem !important;
      font-weight: 800 !important;
      color: var(--text-heading) !important;
      margin-top: 0.5rem;
      margin-bottom: 1.2rem;
      letter-spacing: -0.02em;
    }

    .markdown-section h2,
    h2 {
      font-size: 1.45rem !important;
      font-weight: 700 !important;
      color: var(--text-heading) !important;
      border-bottom: 1px solid var(--border-color) !important;
      padding-bottom: 8px;
      margin-top: 2.2rem;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .markdown-section h3,
    h3 {
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      color: var(--text-heading) !important;
      margin-top: 1.5rem;
    }

    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6,
    h4, h5, h6 {
      color: var(--text-heading) !important;
      font-weight: 600 !important;
    }

    /* REGRAS ESPECÍFICAS DE FORÇA PARA O TEMA ESCURO */
    html.dark .markdown-section h1,
    html.dark .markdown-section h2,
    html.dark .markdown-section h3,
    html.dark .markdown-section h4,
    html.dark .markdown-section h5,
    html.dark .markdown-section h6,
    html.dark h1, html.dark h2, html.dark h3, html.dark h4,
    body.dark .markdown-section h1,
    body.dark .markdown-section h2,
    body.dark .markdown-section h3,
    body.dark .markdown-section h4,
    body.dark .markdown-section h5,
    body.dark .markdown-section h6,
    body.dark h1, body.dark h2, body.dark h3, body.dark h4,
    body.dark .brand-title {
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    html.dark .markdown-section p,
    html.dark .markdown-section li,
    html.dark .markdown-section span,
    body.dark .markdown-section p,
    body.dark .markdown-section li,
    body.dark .markdown-section span {
      color: #f1f5f9 !important;
    }

    html.dark .markdown-section strong,
    html.dark .markdown-section b,
    body.dark .markdown-section strong,
    body.dark .markdown-section b {
      color: #ffffff !important;
    }

    .markdown-section p, 
    .markdown-section li {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text-color) !important;
    }

    .markdown-section strong {
      color: var(--text-heading) !important;
      font-weight: 700;
    }

    .markdown-section a {
      color: var(--accent-color) !important;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .markdown-section a:hover {
      text-decoration: underline;
    }

    .markdown-section hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 2rem 0;
    }

    /* =========================================
       PASSO A PASSO NUMERADO COM BADGES
       ========================================= */
    .markdown-section ol {
      list-style: none !important;
      counter-reset: step-counter;
      padding-left: 0 !important;
      margin: 1.8rem 0 !important;
    }

    .markdown-section ol > li {
      position: relative !important;
      padding-left: 46px !important;
      margin-bottom: 18px !important;
      counter-increment: step-counter;
      line-height: 1.65;
    }

    .markdown-section ol > li::before {
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: var(--step-badge-bg) !important;
      color: var(--step-badge-text) !important;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    /* =========================================
       CAIXA DE DICA / CALLOUT ELEGANTE
       ========================================= */
    .markdown-section blockquote {
      margin: 1.8rem 0 !important;
      padding: 16px 20px !important;
      background-color: var(--callout-bg) !important;
      border-left: 4px solid var(--callout-border) !important;
      border-radius: 4px 10px 10px 4px;
      box-shadow: var(--shadow-sm);
    }

    .markdown-section blockquote p {
      margin: 0 !important;
      font-size: 0.95rem !important;
      color: var(--callout-text) !important;
      line-height: 1.6 !important;
    }

    .markdown-section blockquote strong {
      color: var(--callout-text) !important;
    }

    /* =========================================
       CÓDIGO E TABELAS
       ========================================= */
    .markdown-section code {
      background-color: var(--code-bg) !important;
      color: var(--code-text) !important;
      padding: 3px 6px !important;
      border-radius: 5px !important;
      font-size: 0.9em !important;
      border: 1px solid var(--border-color);
    }

    .markdown-section pre {
      background-color: var(--code-bg) !important;
      border: 1px solid var(--border-color);
      border-radius: 8px !important;
      padding: 16px !important;
    }

    .markdown-section pre code {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }

    /* =========================================
       VÍDEOS RESPONSIVOS EMBEDDED
       ========================================= */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: 1.5rem 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      aspect-ratio: 16 / 9;
      background-color: #000000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
    }

    /* =========================================
       BOTÃO DE MENU MOBILE (3 BARRINHAS)
       ========================================= */
    .mobile-menu-btn {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 36px;
      height: 36px;
      background-color: var(--search-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
      box-sizing: border-box;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .mobile-menu-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background-color: var(--text-heading) !important;
      border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    /* Ocultar toggle nativo do Docsify */
    .sidebar-toggle {
      display: none !important;
    }

    /* =========================================
       RESPONSIVIDADE MOBILE
       ========================================= */
    @media screen and (max-width: 768px) {
      .app-header {
        padding: 0 12px !important;
      }
      .mobile-menu-btn {
        display: flex !important;
      }
      .brand {
        margin-left: 0 !important;
        gap: 8px !important;
      }
      .brand img {
        height: 28px !important;
      }
      .brand-title {
        font-size: 0.95rem !important;
      }
      .brand-subtitle {
        display: none !important;
      }
      .header-actions {
        gap: 8px !important;
      }
      .theme-toggle-btn {
        width: 32px !important;
        height: 32px !important;
        font-size: 0.95rem !important;
      }
      .search input {
        width: 110px !important;
        padding: 6px 10px 6px 28px !important;
        font-size: 0.8rem !important;
      }
      .search input:focus {
        width: 145px !important;
      }
      .search .input-wrap::before {
        left: 8px !important;
        font-size: 0.7rem !important;
      }
      .search .results-panel {
        width: calc(100vw - 24px) !important;
        right: -50px !important;
      }

      /* Drawer da Sidebar */
      .sidebar {
        position: fixed !important;
        top: 64px !important;
        left: -300px !important;
        width: 280px !important;
        height: calc(100vh - 64px) !important;
        background-color: var(--sidebar-bg) !important;
        transform: none !important;
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1) !important;
        z-index: 10000 !important;
        box-shadow: none !important;
        filter: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        opacity: 1 !important;
      }

      /* Aberto no mobile */
      body.close .sidebar {
        transform: translateX(300px) !important;
        box-shadow: 10px 0 35px rgba(0, 0, 0, 0.6) !important;
      }

      /* Backdrop escurecido nítido ao abrir o menu (sem blur para não embaçar o texto) */
      body.close::after {
        content: "";
        position: fixed;
        top: 64px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.65) !important;
        z-index: 9999 !important;
        pointer-events: auto;
      }

      .content {
        left: 0 !important;
        padding-top: 72px !important;
        max-width: 100% !important;
      }
      .markdown-section {
        padding: 20px 14px !important;
      }
    }
  </style>
</head>
<body>
  <!-- Header Fixo Superior -->
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menu de navegação" title="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a href="#/" class="brand">
        <img src="_design/logo.png" alt="Proton Logo" onerror="this.style.display='none'">
        <div>
          <div class="brand-title">Proton ajuda</div>
          <div class="brand-subtitle">Central de ajuda</div>
        </div>
      </a>
    </div>
    <div class="header-actions">
      <div id="search-container"></div>
      <button class="theme-toggle-btn" id="theme-toggle" title="Alternar tema claro/escuro">🌙</button>
    </div>
  </header>

  <div id="app">Carregando documentação...</div>

  <script>
    // Gerenciador de Tema (Dark / Light)
    const savedTheme = localStorage.getItem('proton-help-theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');

    function applyTheme(theme) {
      const toggleBtn = document.getElementById('theme-toggle');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
        if (toggleBtn) toggleBtn.textContent = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
        if (toggleBtn) toggleBtn.textContent = '🌙';
      }
      localStorage.setItem('proton-help-theme', theme);
    }

    // Aplicação imediata no carregamento do script
    if (initialTheme === 'dark') {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme(initialTheme);
      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const isDark = document.body.classList.contains('dark') || document.documentElement.classList.contains('dark');
          applyTheme(isDark ? 'light' : 'dark');
        });
      }

      // Botão hamburguer mobile (3 barrinhas)
      const mobileBtn = document.getElementById('mobile-menu-btn');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.body.classList.toggle('close');
        });
      }
    });

    // Configuração do Docsify
    window.$docsify = {
      name: 'Proton ajuda',
      repo: '',
      loadSidebar: true,
      autoHeader: false,
      subMaxLevel: 2,
      homepage: 'README.md',
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar na ajuda...',
        noData: 'Nenhum resultado encontrado.',
        depth: 3
      },
      plugins: [
        function(hook, vm) {
          hook.mounted(function() {
            const searchEl = document.querySelector('.search');
            const targetContainer = document.getElementById('search-container');
            if (searchEl && targetContainer && !targetContainer.contains(searchEl)) {
              targetContainer.appendChild(searchEl);
            }
          });
          hook.doneEach(function() {
            const searchEl = document.querySelector('.sidebar .search');
            const targetContainer = document.getElementById('search-container');
            if (searchEl && targetContainer && !targetContainer.contains(searchEl)) {
              targetContainer.appendChild(searchEl);
            }

            // Fechar sidebar mobile ao clicar em um link
            const sidebarLinks = document.querySelectorAll('.sidebar-nav a');
            sidebarLinks.forEach(link => {
              link.addEventListener('click', () => {
                if (window.innerWidth <= 768 && document.body.classList.contains('close')) {
                  document.body.classList.remove('close');
                }
              });
            });
          });
        }
      ]
    };

    // Fechar menu mobile ao clicar fora (backdrop)
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && document.body.classList.contains('close')) {
        const sidebar = document.querySelector('.sidebar');
        const mobileBtn = document.getElementById('mobile-menu-btn');
        if (sidebar && !sidebar.contains(e.target) && mobileBtn && !mobileBtn.contains(e.target)) {
          document.body.classList.remove('close');
        }
      }
    });
  </script>
